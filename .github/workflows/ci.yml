name: CI

on:
  push:
    branches: [main]
  pull_request:

# The workflow only needs to read the repository. Jobs that need more must ask for it explicitly.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Actions are pinned to a full commit SHA so a moved or compromised tag cannot change what runs.
      # Dependabot keeps the SHAs up to date (see .github/dependabot.yml).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build, test, lint
        run: ./gradlew build
      - name: API compatibility
        run: ./gradlew apiCheck
