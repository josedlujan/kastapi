version: 2
updates:
  # GitHub Actions: keeps the pinned commit SHAs in the workflows current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # Gradle: the version catalog (gradle/libs.versions.toml) and the plugins.
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: build
    open-pull-requests-limit: 5
    groups:
      # These must move together: the Kotlin compiler plugin and its serialization plugin.
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
      # Ktor modules are released together.
      ktor:
        patterns:
          - "io.ktor*"
